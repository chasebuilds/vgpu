<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chase Builds Hero Effects</title>
<meta name="description" content="Four WebGPU hero backgrounds for small business sites, built on vgpu.">
<style>
:root{--ink:#1b1714;--glass:rgba(255,248,240,.14);--line:rgba(255,240,225,.28);--txt:#fff7ef}
*{box-sizing:border-box}html,body{margin:0;background:#1b1714;color:var(--txt);font:16px/1.5 system-ui,Segoe UI,sans-serif}
canvas{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:radial-gradient(120% 90% at 30% 20%,#7a3b22,#2a1812 60%,#1b1714)}
main{position:relative;min-height:100vh;display:flex;flex-direction:column;justify-content:space-between;padding:24px 16px;max-width:1100px;margin:auto;pointer-events:none}
.panel{pointer-events:auto;background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);border:1px solid var(--line);border-radius:22px;padding:22px}
nav{display:flex;justify-content:space-between;align-items:center;border-radius:999px;padding:10px 18px}
nav a{color:var(--txt);text-decoration:none;font-weight:600}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:.2em 0}
.hero{max-width:560px;margin:8vh 0}
.picks{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
button{all:unset;cursor:pointer;display:block;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:rgba(27,23,20,.35);color:var(--txt)}
button[aria-pressed=true]{background:rgba(255,240,225,.85);color:var(--ink)}
button b{display:block}button span{font-size:.88rem;opacity:.85}
#note{font-size:.85rem;opacity:.8;margin-top:12px}
code{background:rgba(0,0,0,.35);padding:2px 6px;border-radius:6px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<main>
  <nav class="panel"><a href="https://chasebuilds.github.io">Chase Builds</a><a href="https://github.com/chasebuilds/vgpu/tree/canary/chasebuilds/effects">Code</a></nav>
  <section class="hero panel">
    <h1>Hero effects that make a small site stand out.</h1>
    <p>Four live WebGPU backgrounds, ready to drop behind a headline. Move your mouse over the page. Pick one below.</p>
  </section>
  <section class="panel">
    <div class="picks" id="picks"></div>
    <p id="note">Use it: <code>mountHero(canvas, "aurora")</code> from <code>hero.js</code>. Browsers without WebGPU keep the canvas's CSS gradient.</p>
  </section>
</main>
<script type="module">
import { EFFECTS } from "./effects.js";
import { mountHero } from "./hero.js";
const picks = document.getElementById("picks");
let hero;
const choose = (key) => {
  for (const b of picks.children) b.setAttribute("aria-pressed", b.dataset.key === key);
  hero?.use(key);
};
for (const [key, e] of Object.entries(EFFECTS)) {
  const b = document.createElement("button");
  b.dataset.key = key;
  b.innerHTML = `<b>${e.name}</b><span>${e.blurb}</span>`;
  b.onclick = () => choose(key);
  picks.append(b);
}
try { hero = await mountHero(document.getElementById("c"), "aurora"); }
catch (err) { console.error(err); }
if (!hero) document.getElementById("note").textContent = "WebGPU is not available in this browser, so you are seeing the fallback gradient. Try Chrome or Edge.";
choose("aurora");
</script>
</body>
</html>
